name: CI

# Checks on every push and pull request: PHP syntax of all scripts, the package's own
# conventions (docblocks, DOC-01) and a start of the ps-module command.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax
        run: |
          for file in bin/ps-module src/*.php resources/*.php; do
            php -l "$file" > /dev/null || { echo "::error file=$file::syntax error"; exit 1; }
          done

      - name: Conventions (docblocks on every function and class)
        run: php src/conventions-check.php .

      - name: ps-module starts
        run: php bin/ps-module help
